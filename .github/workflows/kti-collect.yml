name: KTI 데이터 수집

on:
  schedule:
    - cron: "17 22 * * *"   # 매일 07:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kti/data/events.csv"
      - "kti/data/schedule.csv"
      - "kti/collector/**"

permissions:
  contents: write

concurrency:
  group: kti-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install pandas numpy requests yfinance

      - name: 수집 및 지수 계산
        run: python kti/collector/collect.py

      - name: 변경분 커밋
        run: |
          git config user.name "kti-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kti/data
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "kti: 데이터 갱신 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
